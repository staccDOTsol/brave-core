name: Creator browser checks

on:
  push:
    branches: ['master', 'codex/**']
    paths:
      - 'components/creator_economy/**'
      - 'build/services.gni'
      - 'components/constants/BUILD.gn'
      - 'components/ai_chat/core/common/buildflags/**'
      - 'components/brave_search/common/buildflags/**'
      - 'components/speech_to_text/**'
      - 'build/commands/lib/repositories*'
      - 'app/theme/**'
      - 'build/mac/**'
      - 'ios/brave-ios/App/**'
      - 'components/brave_wallet_ui/**'
      - 'components/resources/wallet_strings.grdp'
      - 'android/java/org/chromium/chrome/browser/crypto_wallet/**'
      - 'android/java/brave-res/**'
      - 'ios/brave-ios/Sources/BraveWallet/**'
      - 'ios/brave-ios/Sources/BraveShared/BraveURLs.swift'
      - 'components/brave_rewards/resources/creator_detection/**'
      - '.github/workflows/creator-economy.yml'
      - '.github/workflows/creator-native-build.yml'
      - 'docs/creator_economy.md'
  pull_request:
    paths:
      - 'components/creator_economy/**'
      - 'build/services.gni'
      - 'components/constants/BUILD.gn'
      - 'components/ai_chat/core/common/buildflags/**'
      - 'components/brave_search/common/buildflags/**'
      - 'components/speech_to_text/**'
      - 'build/commands/lib/repositories*'
      - 'app/theme/**'
      - 'build/mac/**'
      - 'ios/brave-ios/App/**'
      - 'components/brave_wallet_ui/**'
      - 'components/resources/wallet_strings.grdp'
      - 'android/java/org/chromium/chrome/browser/crypto_wallet/**'
      - 'android/java/brave-res/**'
      - 'ios/brave-ios/Sources/BraveWallet/**'
      - 'ios/brave-ios/Sources/BraveShared/BraveURLs.swift'
      - 'components/brave_rewards/resources/creator_detection/**'
      - '.github/workflows/creator-economy.yml'
      - '.github/workflows/creator-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accounting:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            build/commands/lib
            components/creator_economy
            components/constants
            components/ai_chat/core/common/buildflags
            components/brave_origin/buildflags
            components/brave_search/common/buildflags
            components/speech_to_text
            components/brave_wallet_ui
            components/resources
            android/java/brave-res
            android/java/org/chromium/chrome/browser/crypto_wallet
            ios/brave-ios/Sources/BraveWallet
            ios/brave-ios/Sources/BraveShared
            components/brave_rewards/resources/creator_detection
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Verify mint referrals, accounting, creator library and detection
        run: node --test "components/creator_economy/common/*.test.mjs" "components/creator_economy/ci/*.test.mjs"
      - name: Check release service configuration with GN
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/creator-gn.zip" 'https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/git_revision:150a9d6ba0aa7f407aa4feeabc5f03ce9aa7e04b'
          printf '%s  %s\n' '7f05124cf22efb2e4a38f50cc9efcda91f11c2a271fbf1f37a6f10a73a140cae' "$RUNNER_TEMP/creator-gn.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/creator-gn.zip" gn -d "$RUNNER_TEMP/creator-gn"
          chmod +x "$RUNNER_TEMP/creator-gn/gn"
          python3 components/creator_economy/ci/check-service-build.py --gn "$RUNNER_TEMP/creator-gn/gn"
      - name: Type-check creator wallet models
        working-directory: ${{ runner.temp }}
        run: npm exec --yes --package=typescript@5.9.3 -- tsc --noEmit --strict --target ES2019 --lib ESNext,DOM --module ESNext --moduleResolution bundler "${{ github.workspace }}/components/creator_economy/common/mint-fees.ts" "${{ github.workspace }}/components/brave_wallet_ui/common/creator-economy/creator-library.ts"
      - name: Type-check the shared Brave detector
        working-directory: ${{ runner.temp }}
        run: npm exec --yes --package=typescript@5.9.3 -- tsc --noEmit --strict --target ES2022 --lib DOM,DOM.Iterable,ES2022 --module ESNext --moduleResolution bundler "${{ github.workspace }}/components/brave_rewards/resources/creator_detection/creator_detection.ts"
      - name: Transpile creator wallet UI
        working-directory: ${{ runner.temp }}
        run: npm exec --yes --package=esbuild@0.25.10 -- esbuild "${{ github.workspace }}/components/brave_wallet_ui/page/screens/creators/creator-hub.tsx" "${{ github.workspace }}/components/brave_wallet_ui/page/screens/creators/creator-hub.style.ts" "${{ github.workspace }}/components/brave_wallet_ui/page/screens/creators/creator-hub.stories.tsx" --outdir=creator-ui-syntax --target=es2019 --format=esm
      - name: Parse Android resources and localized wallet strings
        run: python3 components/creator_economy/ci/check-resources.py
      - name: Parse native iOS changes
        if: runner.os == 'macOS'
        run: swiftc -frontend -parse ios/brave-ios/Sources/BraveWallet/Panels/WalletPanelView.swift ios/brave-ios/Sources/BraveWallet/WalletStrings.swift ios/brave-ios/Sources/BraveShared/BraveURLs.swift
      - name: Check remote build script syntax
        run: |
          node --check components/creator_economy/ci/native-build.mjs
          node --check components/creator_economy/ci/release.mjs
