name: Creator browser native build
run-name: Native ${{ inputs.target }} · ${{ inputs.configuration }} · ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native platform to compile remotely
        type: choice
        options: [linux, android, macos, ios, windows]
        required: true
      runner:
        description: Runner label with matching OS/toolchain (100 GB free disk, 8 GB RAM minimum)
        type: string
        required: true
      configuration:
        description: Build configuration
        type: choice
        options: [Component, Release]
        default: Component
      preflight_only:
        description: Check runner capacity without downloading Chromium or compiling
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: creator-native-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      CREATOR_BUILD_TARGET: ${{ inputs.target }}
      CREATOR_BUILD_CONFIGURATION: ${{ inputs.configuration }}
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
    defaults:
      run:
        working-directory: src/brave
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: src/brave
          fetch-depth: 1
          sparse-checkout: components/creator_economy/ci
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Check runner capacity before downloading Chromium
        run: node components/creator_economy/ci/native-build.mjs --preflight
      - name: Expand source checkout
        if: ${{ !inputs.preflight_only }}
        run: git sparse-checkout disable
      - name: Install pinned package manager
        if: ${{ !inputs.preflight_only }}
        run: npm install --global pnpm@11.11.0
      - name: Initialize and compile on the remote runner
        if: ${{ !inputs.preflight_only }}
        run: node components/creator_economy/ci/native-build.mjs
      - name: Save build record and logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ inputs.target }}-${{ github.run_id }}
          path: |
            src/brave/creator-build-record.json
            src/brave/creator-build.log
          retention-days: 14
          if-no-files-found: warn

# Native source integration, distributable packaging and signing are separate
# milestones. This workflow compiles the selected checkout; it does not publish.
