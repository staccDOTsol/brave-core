name: build mirror browser

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Single target to build (empty = all in matrix)"
        required: false
        default: ""
  push:
    branches: [crekk-mirror]
    paths:
      - "components/crekk_mirror/**"
      - "browser/extensions/**"
      - "brave_paks.gni"
      - ".github/workflows/build-mirror.yml"

env:
  # chromium rev the fork builds against (154.0.8037.58, synced 2026-09-23)
  CHROMIUM_REV: a654841425914cbb703a2931e07b70a83aedbafd

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            runs-on: macos-15
            target: Release
          - name: linux-x64
            runs-on: [self-hosted, linux, x64, mirror-builder]
            target: Release
          # add when runners exist:
          # - name: win-x64
          #   runs-on: [self-hosted, windows, x64, mirror-builder]
          #   target: Release
          # - name: mac-x64
          #   runs-on: [self-hosted, macos, x64, mirror-builder]
          #   target: Release
          # - name: android-arm64
          #   runs-on: [self-hosted, linux, x64, mirror-builder]
          #   target: Release android-arm64
          # - name: ios-arm64
          #   runs-on: [self-hosted, macos, arm64, mirror-builder]
          #   target: Release ios
    steps:
      - name: checkout brave-core
        uses: actions/checkout@v4
        with:
          path: src/brave
          ref: ${{ github.ref }}

      - name: depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: gclient config + sync
        run: |
          python3 -m pip install --user packaging
          export PATH="$HOME/Library/Python/3.9/bin:$PATH:$PATH"
          cat > .gclient <<EOF
          solutions = [
            {
              "managed": False,
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "custom_deps": {
                "src/testing/libfuzzer/fuzzers/wasm_corpus": None,
                "src/third_party/chromium-variations": None
              },
              "custom_vars": {
                "checkout_pgo_profiles": False,
                "checkout_clang_coverage_tools": True,
                "checkout_clangd": True
              }
            },
            {
              "managed": False,
              "name": "src/brave",
              "url": "https://github.com/staccDOTsol/brave-core.git"
            }
          ]
          target_cpu = ["arm64"]
          EOF
          gclient sync -D --revision src@$CHROMIUM_REV --with_branch_heads

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.10.0

      - name: build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cd src/brave
          npm install
          npm run build -- --target=${{ matrix.target }} ${{ github.event.inputs.extra_build_flags }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mirror-${{ matrix.name }}
          path: |
            src/out/${{ matrix.target }}/Brave-Browser.dmg
            src/out/${{ matrix.target }}/brave-browser.dmg
            src/out/${{ matrix.target }}/*.deb
            src/out/${{ matrix.target }}/*.zip
            src/out/${{ matrix.target }}/*.exe
          if-no-files-found: warn
